<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGX Pro — فرص السوق</title>
<meta name="description" content="أفضل فرص أسهم البورصة المصرية مرتبة بالقوة الفنية — تحليل شامل لكل سهم.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="logo"><a href="/" style="color:white;text-decoration:none;">📈 EGX <span>Pro</span></a></div>
  <div class="header-right">
    <span class="status-chip" id="statusChip">...</span>
    <span id="clock"></span>
  </div>
</header>
<div id="nav" data-page="opportunities"></div>

<div class="wrap">
  <div class="page-head">
    <h2>💡 فرص السوق — ترتيب آلي بالقوة الفنية</h2>
    <p>تحليل كامل (18 مؤشراً + نماذج + عائد/مخاطرة) لأكبر أسهم البورصة المصرية، مرتّب بالأقوى شراءً. اضغط أي بطاقة للتحليل المفصّل.</p>
  </div>
  <div class="controls">
    <div class="seg" id="universeSeg">
      <button data-n="30" class="active">EGX30</button>
      <button data-n="70">أكبر 70</button>
      <button data-n="100">أكبر 100</button>
    </div>
    <button id="runBtn" class="btn-primary">🚀 حلل السوق</button>
  </div>
  <div id="status" class="status-line"></div>
  <div id="cards" class="opp-grid"></div>
  <div class="caption" style="margin-top:1rem;">الترتيب استرشادي مبنى على التحليل الفني — الأسعار من TradingView (متأخرة ~15 دقيقة) • ليس نصيحة استثمارية</div>
</div>

<script src="/static/common.js"></script>
<script src="/static/opportunities.js"></script>
</body>
</html>
